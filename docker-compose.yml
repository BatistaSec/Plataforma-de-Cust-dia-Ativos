version: '3.8'

services:
  # ----------------------------------------
  # PostgreSQL (Database)
  # ----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: custody-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: custody_user
      POSTGRES_PASSWORD: custody_password
      POSTGRES_DB: custody_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - custody-network

  # ----------------------------------------
  # Redis (Cache / Estado rápido)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: custody-redis
    ports:
      - "6379:6379"
    networks:
      - custody-network

  # ----------------------------------------
  # Kafka (Message Broker - KRaft Mode)
  # Sem necessidade de Zookeeper
  # ----------------------------------------
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: custody-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - custody-network

networks:
  custody-network:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
