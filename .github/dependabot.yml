version: 2

updates:

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # ── Maven: api-gateway ──────────────────────────────────────────────────────
  - package-ecosystem: "maven"
    directory: "/api-gateway"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "fix(deps)"
    open-pull-requests-limit: 10

  # ── Maven: auth-service ─────────────────────────────────────────────────────
