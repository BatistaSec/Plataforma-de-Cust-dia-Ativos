name: CI/CD — Auth Service

# ─── TRIGGERS ──────────────────────────────────────────────────────────────────
# Push em main → pipeline completo (CI + CD)
# PR para main → apenas CI (sem deploy)
on:
  push:
    branches: [main]
    paths:
      - 'auth-service/**'
      - 'pom.xml'
      - '.github/workflows/ci-cd-auth-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'auth-service/**'
      - 'pom.xml'
      - '.github/workflows/ci-cd-auth-service.yml'

# ─── CONCURRENCY ───────────────────────────────────────────────────────────────
# Cancela runs em andamento do mesmo branch/PR para evitar deploys simultâneos.
# Em main o grupo é por workflow, então não cancela uma run de deploy ativa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SERVICE:          auth-service
  ECR_REPOSITORY:   custody-portfolio/auth-service
  ECS_SERVICE:      auth-service
  ECS_CLUSTER:      custody-portfolio-cluster
  CONTAINER_NAME:   auth-service
  AWS_REGION:       us-east-1
  JAVA_VERSION:     '21'
  TERRAFORM_VERSION: '1.7.0'

# ─── STEP 1 — BRANCH PROTECTION & VALIDATION ──────────────────────────────────
jobs:
  validate-branch:
    name: "1 · Validate Branch"
    runs-on: ubuntu-latest
    steps:
      - name: Block direct push to main without PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "ℹ️  Push direto em main permitido (proteção adicional deve ser configurada via branch protection rules no GitHub)."

      - name: Validate PR title format (feat/fix/chore/ci/docs)
        if: github.event_name == 'pull_request'
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|chore|ci|docs|refactor|test|perf|revert)(\(.+\))?!?:.+'; then
            echo "❌ PR title não segue Conventional Commits: '$TITLE'"
            echo "   Esperado: feat(auth): ..., fix: ..., chore: ..."
            exit 1
          fi
          echo "✅ PR title válido: $TITLE"

# ─── STEP 2 — BUILD ───────────────────────────────────────────────────────────
  build:
    name: "2 · Build"
    runs-on: ubuntu-latest
    needs: validate-branch
    outputs:
      jar-path: ${{ steps.jar.outputs.jar-path }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build (skip tests)
        run: mvn -pl auth-service -am clean package -DskipTests -B -q

      - name: Identify jar
        id: jar
        run: echo "jar-path=$(ls auth-service/target/*.jar | grep -v original | head -1)" >> $GITHUB_OUTPUT

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SERVICE }}-jar-${{ github.sha }}
          path: auth-service/target/*.jar
          retention-days: 1
          if-no-files-found: error

# ─── STEP 2 — TESTES ──────────────────────────────────────────────────────────
  test:
    name: "2 · Tests"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run unit & integration tests
        run: mvn -pl auth-service -am verify -B

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Auth Service — Test Report
          path: auth-service/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

# ─── STEP 3 — SECURITY + QUALITY GATES ───────────────────────────────────────
  security:
    name: "3 · Security & Quality"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para o gitleaks verificar o histórico completo

      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false   # segredos no código bloqueiam o pipeline

      - name: Dependency vulnerability scan (Trivy filesystem)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: auth-service
          format: table
          exit-code: '1'           # CRITICAL ou HIGH bloqueiam o pipeline
          ignore-unfixed: true
          severity: CRITICAL,HIGH

# ─── STEP 4 — DOCKER BUILD + SCAN ─────────────────────────────────────────────
  docker:
    name: "4 · Docker Build & Scan + 5 · Push ECR"
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SERVICE }}-jar-${{ github.sha }}
          path: auth-service/target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── STEP 4: Docker build ──────────────────────────────────────────────
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref }}" \
            --label "build.run=${{ github.run_id }}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            auth-service/

      - name: Scan Docker image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      # ── STEP 5: Push para ECR (SHA + latest) ─────────────────────────────
      - name: Push image to ECR
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

# ─── STEP 6 — TERRAFORM PLAN / APPLY ─────────────────────────────────────────
  terraform:
    name: "6 · Terraform Plan & Apply"
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: terraform/auth-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -var="image_tag=${{ github.sha }}" -out=tfplan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

# ─── STEP 7 — DEPLOY ECS FARGATE ─────────────────────────────────────────────
  deploy:
    name: "7 · Deploy ECS Fargate"
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    outputs:
      previous-task-def: ${{ steps.snapshot.outputs.previous-task-def }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Guarda a revisão anterior para rollback
      - name: Snapshot current task definition revision
        id: snapshot
        run: |
          PREV=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "previous-task-def=$PREV" >> $GITHUB_OUTPUT
          echo "📸 Task definition atual: $PREV"

      - name: Download current task definition JSON
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   ${{ env.CONTAINER_NAME }}
          image:            ${{ needs.docker.outputs.image }}

      - name: Deploy to ECS (rolling update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:           ${{ steps.task-def.outputs.task-definition }}
          service:                   ${{ env.ECS_SERVICE }}
          cluster:                   ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

# ─── STEP 8 — SMOKE TESTS + OBSERVABILIDADE ──────────────────────────────────
  smoke:
    name: "8 · Smoke Tests & Observability"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5
    outputs:
      smoke-passed: ${{ steps.result.outputs.passed }}
    steps:
      - name: Wait for ECS stabilization
        run: sleep 20

      - name: Health check — /actuator/health
        id: health
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "${{ secrets.AUTH_SERVICE_URL }}/actuator/health" || echo "000")
            echo "Tentativa $i: $STATUS"
            [ "$STATUS" = "200" ] && break
            [ "$i" = "3" ] && { echo "❌ Health check falhou após 3 tentativas"; exit 1; }
            sleep 10
          done
          echo "✅ Health check OK"

      - name: Smoke test — POST /api/v1/auth/register (idempotente)
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -X POST "${{ secrets.AUTH_SERVICE_URL }}/api/v1/auth/register" \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke-ci@test.internal","password":"Smok3T3st!"}' || echo "000")
          # 201 = criado, 409 = já existe (idempotente) — ambos são sucesso do endpoint
          if [[ "$STATUS" != "201" && "$STATUS" != "409" ]]; then
            echo "❌ Register retornou $STATUS (esperado 201 ou 409)"
            exit 1
          fi
          echo "✅ Register OK: $STATUS"

      - name: Smoke test — POST /api/v1/auth/login
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -X POST "${{ secrets.AUTH_SERVICE_URL }}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke-ci@test.internal","password":"Smok3T3st!"}' || echo "000")
          if [[ "$STATUS" != "200" ]]; then
            echo "❌ Login retornou $STATUS (esperado 200)"
            exit 1
          fi
          echo "✅ Login OK"

      - name: Mark smoke result
        id: result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

# ─── STEP 9 — ROLLBACK AUTOMÁTICO ────────────────────────────────────────────
  rollback:
    name: "9 · Rollback on Failure"
    runs-on: ubuntu-latest
    needs: [deploy, smoke]
    # Executa apenas se smoke falhou E deploy foi bem-sucedido
    if: |
      always() &&
      needs.smoke.result == 'failure' &&
      needs.deploy.result == 'success'
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Rollback to previous task definition
        run: |
          PREV="${{ needs.deploy.outputs.previous-task-def }}"
          echo "⏪ Revertendo para: $PREV"
          aws ecs update-service \
            --cluster   ${{ env.ECS_CLUSTER }} \
            --service   ${{ env.ECS_SERVICE }} \
            --task-definition "$PREV" \
            --force-new-deployment \
            > /dev/null
          echo "⏳ Aguardando estabilização após rollback..."
          aws ecs wait services-stable \
            --cluster  ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "✅ Rollback concluído para $PREV"

      - name: Annotate run with rollback notice
        run: |
          echo "::error title=Rollback executado::Smoke tests falharam. Serviço revertido para ${{ needs.deploy.outputs.previous-task-def }}"
          exit 1   # marca o workflow como falho para visibilidade no PR
