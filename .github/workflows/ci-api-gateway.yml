name: CI - API Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'api-gateway/**'
      - 'pom.xml'
  pull_request:
    branches:
      - main
    paths:
      - 'api-gateway/**'
      - 'pom.xml'

jobs:
  build-and-test:
    name: Build and Test API Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: mvn -pl api-gateway -am clean verify
