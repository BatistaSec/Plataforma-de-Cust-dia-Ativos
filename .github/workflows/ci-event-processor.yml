name: CI - Event Processor

on:
  push:
    branches:
      - main
    paths:
      - 'event-processor/**'
      - 'pom.xml'
  pull_request:
    branches:
      - main
    paths:
      - 'event-processor/**'
      - 'pom.xml'

jobs:
  build-and-test:
    name: Build and Test Event Processor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: mvn -pl event-processor -am clean verify
