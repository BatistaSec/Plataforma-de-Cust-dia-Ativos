  <path d="M 450 293 Q 620 390 790 293" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="616" y="380" text-anchor="middle" font-size="7.5" fill="#3fb950">ORDER_CREATED</text>

