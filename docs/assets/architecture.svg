  <text x="65" y="409" font-size="8.5" fill="#c9d1d9">PostgreSQL 16</text>
  <rect x="150" y="398" width="14" height="14" rx="3" fill="#d82c20" opacity=".8"/>
  <text x="157" y="409" text-anchor="middle" font-size="8" fill="white" font-weight="bold">R</text>
  <text x="169" y="409" font-size="8.5" fill="#c9d1d9">Redis 7</text>
  <text x="46" y="428" font-size="8.5" fill="#c9d1d9">⚡ Apache Kafka · KRaft (sem Zookeeper)</text>
  <text x="46" y="445" font-size="8.5" fill="#c9d1d9">🐹 Spring Boot 3.4 · Java 21</text>
  <text x="46" y="459" font-size="8.5" fill="#c9d1d9">🏗️  Clean Architecture · DDD · SOLID · EDA</text>

  <!-- ─── AWS / CICD BADGE ─── -->
  <rect x="750" y="320" width="320" height="145" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="760" y="338" font-size="9" fill="#8b949e" font-weight="bold">INFRAESTRUTURA AWS</text>
  <text x="760" y="355" font-size="8.5" fill="#c9d1d9">🏗️  ECS Fargate  ·  ECR  ·  ALB  ·  VPC</text>
  <text x="760" y="371" font-size="8.5" fill="#c9d1d9">🗄️  RDS PostgreSQL 16  ·  ElastiCache Redis</text>
  <text x="760" y="387" font-size="8.5" fill="#c9d1d9">📨  MSK Kafka  ·  CloudWatch  ·  Terraform</text>
  <line x1="750" y1="398" x2="1070" y2="398" stroke="#21262d" stroke-width="1"/>
  <text x="760" y="413" font-size="9" fill="#8b949e" font-weight="bold">CI/CD — 9 ETAPAS (GitHub Actions)</text>
  <text x="760" y="429" font-size="8.5" fill="#c9d1d9">🔒  Gitleaks + Trivy (fs + image)</text>
  <text x="760" y="445" font-size="8.5" fill="#c9d1d9">🐳  Docker → ECR (SHA + latest)</text>
  <text x="760" y="461" font-size="8.5" fill="#c9d1d9">🔄  Terraform → ECS → Smoke → Rollback</text>

  <!-- Footer -->
  <text x="550" y="496" text-anchor="middle" font-size="9" fill="#21262d">Plataforma de Custódia de Ativos · github.com/BatistaSec/Plataforma-de-Cust-dia-Ativos</text>

  <!-- ─── MARKERS ─── -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
