  <rect x="932" y="22" width="90" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <circle cx="977" cy="47" r="14" fill="#e6522c" opacity=".2"/>
  <circle cx="977" cy="47" r="9" fill="#e6522c" opacity=".5"/>
  <circle cx="977" cy="47" r="5" fill="#e6522c"/>
