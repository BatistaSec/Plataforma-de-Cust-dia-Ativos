  <text x="85" y="372" font-size="8.5" fill="#c9d1d9">Evento Kafka assíncrono</text>
  <line x1="46" y1="386" x2="80" y2="386" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
