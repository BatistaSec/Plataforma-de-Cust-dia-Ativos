  <path d="M 632 110 Q 632 66 720 56" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 877 110 Q 877 65 924 56" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="580" y="72" text-anchor="middle" font-size="7" fill="#8b949e">métricas · traces</text>

