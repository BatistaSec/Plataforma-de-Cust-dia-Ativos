# Configuração de teste para o api-gateway.
# Desativa verificações de conectividade e substitui URLs de serviços por valores
# que não causam falha na inicialização do contexto Spring durante os testes de CI.

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: custody-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/custody/**
        - id: audit-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/audit/**

# Desativa exportação de traces para evitar falha de conexão com OTel no CI
management:
  tracing:
    enabled: false

otel:
  sdk:
    disabled: true
