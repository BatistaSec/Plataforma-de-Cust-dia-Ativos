server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Roteamento para o microsserviço de Autenticação
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
            
        # Roteamento para o microsserviço de Custódia
        - id: custody-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/custody/**
          filters:
            - AuthenticationFilter

# Configuração de Observabilidade e Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, gateway
  endpoint:
    health:
      show-details: always
