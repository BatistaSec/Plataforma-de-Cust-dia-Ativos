server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/custody_db
    username: custody_user
    password: custody_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: aVeryLongSecretKeyForJwtSignatureThatIsAtLeast256BitsLong123!@#
  expiration: 86400000
